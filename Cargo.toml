[workspace]
members = ["crates/mkvsdcu-proto", "crates/mkvsdcu-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mkvsdcu-proto = { path = "crates/mkvsdcu-proto" }
md5 = "=0.8.0"
openssl = "=0.10.81"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
